# ========== 连接 ==========
port = 5432
listen_addresses = '*'
max_connections = 200
unix_socket_directories='/tmp,{$APP_PATH}'

# ========== 内存 ==========
shared_buffers = 1GB                    # 按物理内存 25% 调
work_mem = 8MB
effective_cache_size = 3GB              # 按物理内存 50%~75% 调
maintenance_work_mem = 256MB
temp_buffers = 8MB
max_prepared_transactions = 200
max_stack_depth = 2MB
bgwriter_lru_maxpages = 400
bgwriter_delay = 200ms

# ========== 进程 ==========
max_worker_processes = 16
max_parallel_workers = 16
max_parallel_workers_per_gather = 2
dynamic_shared_memory_type = posix

# ========== 统计 ==========
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = 'all'
pg_stat_statements.max = 10000

# ========== WAL ==========
max_wal_size = 2GB
min_wal_size = 256MB
wal_buffers = 16MB
wal_keep_size = 1GB
max_slot_wal_keep_size = 10GB
wal_compression = on
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# ========== 其他 ==========
datestyle = 'iso, ymd'
timezone = 'Asia/Shanghai'
default_text_search_config = 'pg_catalog.simple'


# ========== 日志 ==========
logging_collector = on
log_timezone = 'Asia/Shanghai'
log_destination = 'stderr'
log_directory = '{$APP_PATH}/logs'
log_filename = 'postgresql-%Y-%m-%d.log'
log_statement = 'ddl'
log_rotation_age = 7d
log_rotation_size = 100MB
log_min_duration_statement = 5000
log_autovacuum_min_duration = 1000
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%m [%p] %q%u@%d '


# ========== 归档 ==========
archive_mode = on
archive_command = 'test ! -f {$APP_PATH}/archivelog/%f && cp %p {$APP_PATH}/archivelog/%f.partial && mv {$APP_PATH}/archivelog/%f.partial {$APP_PATH}/archivelog/%f'
archive_timeout = 300

# ========== 超时 ==========
statement_timeout = 0
lock_timeout = 0
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 6
idle_in_transaction_session_timeout = 600000
deadlock_timeout = 1s

# ========== 自动清理 ==========
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# ==========   监控  ==========
track_io_timing = on
client_connection_check_interval = 10s

